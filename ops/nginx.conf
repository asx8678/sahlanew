# =============================================================================
# Sahla — nginx vhost (§13.6)
#
# nginx terminates TLS, gzips, upgrades the LiveView websocket and forces HTTPS
# in front of the BEAM app (Bandit on 127.0.0.1:4000).
#
# INSTALL
#   This file is a template. The server name comes from the environment, never a
#   brand literal. Render it at deploy time and install to sites-available:
#
#     export SAHLA_SERVER_NAME=assur.example.ma        # the real host
#     envsubst '$SAHLA_SERVER_NAME' \
#       < /opt/sahla/ops/nginx.conf \
#       > /etc/nginx/sites-available/sahla
#     ln -sf /etc/nginx/sites-available/sahla /etc/nginx/sites-enabled/sahla
#     nginx -t && systemctl reload nginx
#
# TLS / CERTBOT
#   Issue and auto-renew a Let's Encrypt certificate with the nginx plugin:
#
#     certbot --nginx -d "$SAHLA_SERVER_NAME"
#
#   certbot writes the cert to /etc/letsencrypt/live/$SAHLA_SERVER_NAME/ and
#   installs its own systemd renew timer (certbot.timer) — no cron needed.
#   The ssl_certificate paths below match certbot's default layout.
#
# HSTS
#   Strict-Transport-Security is emitted here (and also by Phoenix force_ssl in
#   config/prod.exs — either is sufficient, both is harmless). It tells browsers
#   to use HTTPS for a year, including subdomains. Only enable `preload` after
#   submitting the domain to the HSTS preload list.
# =============================================================================

# Maps the client's Upgrade header to the right Connection value so the LiveView
# websocket can be upgraded (and normal requests keep keep-alive).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP :80 — redirect everything to HTTPS ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${SAHLA_SERVER_NAME};

    # `certbot --nginx` injects its own http-01 challenge handling here at issue
    # time, so no webroot location is needed. Everything else redirects to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 — TLS termination + reverse proxy ----------------------------
server {
    # `listen ... ssl http2` (not `http2 on;`) for nginx 1.24 on Ubuntu 24.04,
    # where the standalone `http2` directive (1.25.1+) is not yet available.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${SAHLA_SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${SAHLA_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SAHLA_SERVER_NAME}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: force HTTPS for a year (see header note above).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Relevé (no-claims certificate) uploads — cap at 8MB; nginx 413s anything larger.
    client_max_body_size 8m;

    # Compress text-ish responses. Binary assets (images/fonts) are already packed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # LiveView websocket — requires HTTP/1.1 and the Upgrade/Connection headers.
    location /live {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep idle websockets alive well past LiveView's heartbeat.
        proxy_read_timeout 120s;
    }

    # Everything else — normal HTTP proxy to the app.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
